  :root{
    --font-main:'DIN Next LT Arabic', sans-serif;
    --ink:#f2faf3; --bg-0:#050e08; --bg-1:#0a1f12;
    --leaf-1:#1c6b34; --leaf-2:#2c9a48; --leaf-3:#4fd370;
    --gold:#e3c886; --card-line:rgba(255,255,255,.11); --muted:rgba(242,250,243,.68);
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  html,body{margin:0;padding:0;}
  body{ background:var(--bg-0); color:var(--ink); font-family:var(--font-main); font-weight:300; font-size:16px;
    min-height:100vh; position:relative; overflow-x:hidden; }

  .backdrop{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1200px 750px at 88% -8%, rgba(79,211,112,.18), transparent 60%),
      radial-gradient(950px 650px at -10% 20%, rgba(28,107,52,.22), transparent 55%),
      radial-gradient(700px 500px at 50% 105%, rgba(227,200,134,.08), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-0) 100%); }

  .wrap{ position:relative; z-index:1; max-width:1140px; margin:0 auto; padding:28px 22px 70px; }

  .host-banner{ display:none; background:rgba(227,200,134,.12); border:1px solid rgba(227,200,134,.4); color:#f5ead0;
    font-size:13px; font-weight:300; padding:11px 16px; border-radius:10px; margin-bottom:18px; line-height:1.9; }
  .host-banner.show{ display:block; }

  header.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--card-line); }
  .brand img{ height:80px; width:auto; object-fit:contain; filter: drop-shadow(0 2px 10px rgba(0,0,0,.4)); }

  /* hero */
  .hero{ text-align:center; padding:56px 10px 34px; position:relative; }
  .hero .ring{ position:absolute; inset:0; pointer-events:none; opacity:.55;
    background: conic-gradient(from 200deg at 50% 0%, transparent 0deg, rgba(79,211,112,.14) 60deg, transparent 130deg); }
  .hero .icon-row{ font-size:40px; margin-bottom:16px; letter-spacing:14px; }
  .hero h1{ font-family:var(--font-main); font-weight:800; margin:0; font-size:clamp(32px,6.2vw,56px); line-height:1.25;
    background: linear-gradient(90deg,#fff 10%,#d6f2dc 55%,#8fe6a8 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .tagline{ color:var(--leaf-3); font-weight:500; font-size:16px; margin-top:10px; }
  .hero p.desc{ max-width:660px; margin:20px auto 0; color:var(--muted); font-weight:300; font-size:17px; line-height:2.05; }
  .hero-edit{ max-width:660px; margin:20px auto 0; text-align:right; }

  /* section nav */
  .sec-nav{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:36px 0 6px; position:sticky; top:14px; z-index:5; }
  .sec-nav a{ background:rgba(9,22,14,.82); backdrop-filter: blur(8px); border:1px solid var(--card-line); color:var(--ink);
    text-decoration:none; padding:11px 22px; border-radius:999px; font-size:15px; font-weight:500; display:flex; align-items:center; gap:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); transition: all .2s ease; }
  .sec-nav a:hover{ border-color:var(--leaf-3); color:#fff; transform:translateY(-1px); }

  section.block{ margin-top:78px; scroll-margin-top:90px; }
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  .block-head{ text-align:center; margin-bottom:38px; }
  .block-head .num{ display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%;
    background:rgba(79,211,112,.16); border:1px solid rgba(79,211,112,.45); color:var(--leaf-3); font-weight:700; font-size:15px; margin-bottom:12px; }
  .block-head h2{ font-family:var(--font-main); font-weight:800; font-size:clamp(26px,4.6vw,36px); margin:0 0 8px; }
  .block-head p{ color:var(--muted); font-weight:300; font-size:15.5px; margin:0; }

  /* section 1: map */
  .map-wrap{ border-radius:20px; overflow:hidden; border:1px solid var(--card-line); box-shadow:0 20px 50px rgba(0,0,0,.3); }
  #map{ height:460px; width:100%; background:#0a1f12; }
  .map-toolbar{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .map-toolbar-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .map-toolbar .hint{ color:var(--muted); font-size:13.5px; font-weight:300; }
  .precise-box{ background:rgba(255,255,255,.03); border:1px solid var(--card-line); border-radius:14px; padding:14px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .precise-box input{ flex:1; min-width:160px; }
  .precise-box .lbl{ font-size:13px; color:var(--muted); font-weight:500; white-space:nowrap; }
  .loc-list{ margin-top:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:11px; }
  .loc-chip{ background:rgba(255,255,255,.045); border:1px solid var(--card-line); border-radius:13px; padding:12px 16px; font-size:14.5px;
    display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .loc-chip b{ font-weight:500; }
  .loc-chip .rm{ cursor:pointer; color:#ffb4b4; font-size:14px; }
  .leaflet-popup-content-wrapper{ background:#0e2416; color:#f2faf3; border-radius:10px; }
  .leaflet-popup-content{ font-family:var(--font-main); font-size:14px; direction:rtl; }
  .leaflet-popup-tip{ background:#0e2416; }
  .add-mode-badge{ display:none; background:rgba(227,200,134,.16); border:1px solid rgba(227,200,134,.45); color:#f5ead0;
    font-size:13.5px; padding:10px 16px; border-radius:12px; text-align:center; font-weight:500; }
  .add-mode-badge.show{ display:block; }
  .count-pill{ display:inline-flex; align-items:center; gap:6px; background:rgba(79,211,112,.14); border:1px solid rgba(79,211,112,.4);
    color:var(--leaf-3); font-size:13.5px; font-weight:600; padding:6px 14px; border-radius:999px; }

  /* section 2: stages timeline */
  .timeline{ position:relative; padding:14px 0; }
  .timeline::before{ content:""; position:absolute; top:0; bottom:0; right:calc(50% - 1.5px); width:3px;
    background:linear-gradient(180deg, transparent, rgba(79,211,112,.55) 8%, rgba(79,211,112,.55) 92%, transparent); border-radius:3px; }
  @media (max-width:760px){ .timeline::before{ right:22px; } }
  .stage{ position:relative; display:flex; margin-bottom:40px; }
  .stage:nth-child(odd){ justify-content:flex-start; }
  .stage:nth-child(even){ justify-content:flex-end; }
  @media (max-width:760px){ .stage, .stage:nth-child(even){ justify-content:flex-start; padding-right:50px; } }
  .stage-card{ width:46%; background:linear-gradient(160deg, rgba(44,154,72,.16), rgba(255,255,255,.02)); border:1px solid var(--card-line);
    border-radius:18px; padding:24px 26px; position:relative; box-shadow:0 14px 34px rgba(0,0,0,.22); }
  @media (max-width:760px){ .stage-card{ width:100%; } }
  .stage-num{ position:absolute; top:16px; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--leaf-3),var(--leaf-1));
    color:#052c11; font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px var(--bg-0), 0 0 0 7px rgba(79,211,112,.45); }
  .stage:nth-child(odd) .stage-num{ right:-64px; }
  .stage:nth-child(even) .stage-num{ left:-64px; }
  @media (max-width:760px){ .stage .stage-num{ right:auto; left:-50px; } }
  .stage-icon{ font-size:32px; margin-bottom:10px; }
  .stage h3{ font-family:var(--font-main); font-weight:700; font-size:19.5px; margin:0 0 9px; }
  .stage p{ color:var(--muted); font-weight:300; font-size:15px; line-height:1.95; margin:0 0 12px; white-space:pre-line; }
  .stage img{ width:100%; border-radius:14px; margin-top:10px; display:block; max-height:240px; object-fit:cover; }
  .stage-actions{ display:flex; gap:7px; margin-top:12px; flex-wrap:wrap; }

  .quote-card{ margin:48px auto 0; max-width:600px; text-align:center; padding:38px 28px; border-radius:22px;
    background: linear-gradient(160deg, rgba(227,200,134,.16), rgba(79,211,112,.07)); border:1px solid rgba(227,200,134,.4);
    box-shadow:0 18px 42px rgba(0,0,0,.25); }
  .quote-card .heart{ font-size:30px; margin-bottom:12px; }
  .quote-card p{ font-family:var(--font-main); font-weight:700; font-size:clamp(20px,3.4vw,28px); margin:0; color:#fff; line-height:1.7; }
  .quote-card textarea{ width:100%; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:10px;
    padding:12px; font-family:inherit; font-size:17px; text-align:center; }

  /* section 3: live stats — the showpiece */
  .live-banner{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px; }
  .live-banner .pulse-wrap{ display:inline-flex; align-items:center; gap:8px; background:rgba(255,80,80,.12); border:1px solid rgba(255,90,90,.4);
    color:#ff8686; font-weight:600; font-size:13.5px; padding:7px 16px; border-radius:999px; }
  .live-banner .pulse-dot{ width:8px; height:8px; border-radius:50%; background:#ff5050; animation:pulse 1.3s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(255,80,80,.5);} 50%{ opacity:.4; box-shadow:0 0 0 6px rgba(255,80,80,0);} }

  .mega-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-top:20px; border:1px solid var(--card-line); border-radius:26px;
    overflow:hidden; background:linear-gradient(160deg, rgba(44,154,72,.14), rgba(255,255,255,.015)); box-shadow:0 24px 60px rgba(0,0,0,.3); }
  @media (max-width:820px){ .mega-stats{ grid-template-columns:1fr; } }
  .mega-stat{ position:relative; text-align:center; padding:44px 20px 38px; border-left:1px solid var(--card-line); }
  .mega-stat:last-child{ border-left:none; }
  @media (max-width:820px){ .mega-stat{ border-left:none; border-top:1px solid var(--card-line); }
    .mega-stat:first-child{ border-top:none; } }
  .mega-stat .stat-icon{ font-size:34px; margin-bottom:10px; display:block; }
  .mega-stat .value{ font-family:var(--font-main); font-weight:900; line-height:1; font-size:clamp(42px,7vw,84px);
    background:linear-gradient(180deg,#ffffff 20%, #bdf0c8 100%); -webkit-background-clip:text; background-clip:text; color:transparent;

async function safeGet(key, shared){ if(!HAS_STORAGE) return null; try{ return await window.storage.get(key, shared); }catch(e){ return null; } }
async function safeSet(key, value, shared){ if(!HAS_STORAGE) return null; try{ return await window.storage.set(key, value, shared); }catch(e){ return null; } }
async function safeDelete(key, shared){ if(!HAS_STORAGE) return null; try{ return await window.storage.delete(key, shared); }catch(e){ return null; } }

async function loadState(){
  showHostBanner();
  try{
    const res = await safeGet(K.meta, true);
    if(res && res.value){
      const meta = JSON.parse(res.value);
      state = meta;
      state.stages = state.stages || [];
      for(const s of state.stages){
        s.image = '';
        if(s.hasImage){
          const r = await safeGet(K.stageImg(s.id), true);
          if(r && r.value) s.image = r.value;
        }
      }
    } else {
      state = defaultState();
    }
  }catch(e){ state = defaultState(); }
  render();
}

async function saveState(){
  state.lastUpdated = new Date().toISOString();
  try{
    const meta = {
      heroDesc: state.heroDesc,
      locations: state.locations,
      stages: state.stages.map(s=>({ id:s.id, icon:s.icon, title:s.title, text:s.text, hasImage: !!s.image })),
      closingQuote: state.closingQuote,
      sinceLabel: state.sinceLabel,
      stats: state.stats,
      lastUpdated: state.lastUpdated
    };
    await safeSet(K.meta, JSON.stringify(meta), true);
    for(const s of state.stages){
      if(s.image) await safeSet(K.stageImg(s.id), s.image, true);
      else await safeDelete(K.stageImg(s.id), true);
    }
    showToast(HAS_STORAGE ? 'تم حفظ التحديثات بنجاح ✓' : 'تم الحفظ لهذه الجلسة فقط');
  }catch(e){
    showToast('تعذّر الحفظ: ' + (e && e.message ? e.message : ''));
  }
  render();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 3200);
}

function resizeImageJPEG(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function renderMapSection(){
  const sec = document.createElement('section');
  sec.className = 'block reveal';
  sec.id = 'sec-map';
  sec.innerHTML = `
    <div class="block-head">
      <div class="num">١</div>
      <h2>المواقع الحالية</h2>
      <p>أماكن تواجد حاويات إعادة التدوير حاليًا في ولاية صحار &nbsp;·&nbsp;
        <span class="count-pill">📍 ${(state.locations||[]).length} موقع مسجّل</span>
      </p>
    </div>
    ${isAdmin ? `
      <div class="map-toolbar">
        <div class="map-toolbar-row">
          <span class="hint">فعّل وضع الإضافة ثم اضغط على أي نقطة بالخريطة لتسجيل موقع حاوية جديدة</span>
          <button class="btn btn-ghost" id="toggle-add-mode">${addLocationMode ? '✕ إلغاء وضع الإضافة' : '+ إضافة موقع بالنقر على الخريطة'}</button>
        </div>
        <div class="precise-box">
          <span class="lbl">🎯 إضافة دقيقة بالإحداثيات (انسخها من خرائط Google):</span>
          <input class="field" id="coord-input" type="text" placeholder="مثال: 24.3540, 56.7580" style="margin-top:0;">
          <button class="btn btn-primary" id="coord-add-btn" type="button">إضافة</button>
        </div>
        <div class="precise-box">
          <span class="lbl">🔍 ابحث عن اسم مكان في صحار:</span>
          <input class="field" id="search-place-input" type="text" placeholder="مثال: سوق صحار المركزي" style="margin-top:0;">
          <button class="btn btn-ghost" id="search-place-btn" type="button">بحث</button>
        </div>
        <div class="add-mode-badge ${addLocationMode ? 'show' : ''}" id="add-mode-badge">وضع الإضافة مفعّل — اضغط في أي مكان على الخريطة لتسجيل نقطة هناك</div>
      </div>
    ` : ''}
    <div class="map-wrap"><div id="map"></div></div>
    <div class="loc-list" id="loc-list"></div>
  `;
  return sec;
}

function renderStagesSection(){
  const sec = document.createElement('section');
  sec.className = 'block reveal';
  sec.id = 'sec-stages';
  const stagesHtml = state.stages.map((s,i)=>`
    <div class="stage">
      <div class="stage-card">
        <div class="stage-num">${i+1}</div>
        ${isAdmin ? `
          <input class="field" data-id="${s.id}" data-f="icon" style="max-width:70px;text-align:center;" value="${escapeHtml(s.icon||'')}" placeholder="🔧">
          <input class="field stage-title-input" data-id="${s.id}" data-f="title" value="${escapeHtml(s.title||'')}" placeholder="عنوان المرحلة">
          <textarea class="field stage-text-input" data-id="${s.id}" data-f="text" rows="3" placeholder="وصف المرحلة">${escapeHtml(s.text||'')}</textarea>
          ${s.image ? `<img src="${s.image}" alt="">` : ''}
          <div class="stage-actions">
            <button class="btn btn-ghost stage-img-btn" data-id="${s.id}" type="button">${s.image ? 'تغيير الصورة' : '+ صورة'}</button>
            ${s.image ? `<button class="btn btn-danger stage-img-rm" data-id="${s.id}" type="button">حذف الصورة</button>` : ''}
            <button class="btn btn-danger stage-del" data-id="${s.id}" type="button">حذف المرحلة</button>
          </div>
          <input type="file" class="stage-file" data-id="${s.id}" accept="image/*" style="display:none;">
        ` : `
          <div class="stage-icon">${s.icon||'●'}</div>
          <h3>${escapeHtml(s.title)}</h3>
          <p>${escapeHtml(s.text||'')}</p>
          ${s.image ? `<img src="${s.image}" alt="">` : ''}
        `}
      </div>
    </div>
  `).join('');

  sec.innerHTML = `
    <div class="block-head">
      <div class="num">٢</div>
      <h2>المراحل</h2>
      <p>رحلة البلاستيك من بيتك إلى أن يتحول لصدقة تُعين المحتاج</p>
    </div>
    <div class="timeline">${stagesHtml}</div>
    ${isAdmin ? `<div class="add-block" id="add-stage">+ إضافة مرحلة جديدة</div>` : ''}
    <div class="quote-card">
      <div class="heart">🌱🤍</div>
      ${isAdmin
        ? `<textarea id="quote-input" rows="2">${escapeHtml(state.closingQuote||'')}</textarea>`
        : `<p>${escapeHtml(state.closingQuote||'')}</p>`}
    </div>
  `;
  return sec;
}

function renderStatsSection(){
  const sec = document.createElement('section');
  sec.className = 'block reveal';
  sec.id = 'sec-stats';
  const cards = state.stats.map(s=>`
    <div class="mega-stat" data-id="${s.id}">
      ${isAdmin ? `<div class="del-btn stat-del" data-id="${s.id}">✕</div>` : ''}
      ${isAdmin ? `
        <input class="field" data-id="${s.id}" data-f="icon" value="${escapeHtml(s.icon||'')}" placeholder="📦" style="max-width:70px;text-align:center;margin:0 auto;">
        <input class="field" data-id="${s.id}" data-f="value" value="${escapeHtml(s.value||'')}" placeholder="الرقم">
        <input class="field" data-id="${s.id}" data-f="suffix" value="${escapeHtml(s.suffix||'')}" placeholder="الوحدة (مثال: علبة)">
        <input class="field" data-id="${s.id}" data-f="label" value="${escapeHtml(s.label||'')}" placeholder="الوصف (مثال: تم تجميعها)">
      ` : `
        <span class="stat-icon">${s.icon||''}</span>
        <div class="value" data-target="${escapeHtml(s.value||'')}">0</div>
        <div class="suffix">${escapeHtml(s.suffix||'')}</div>
        <div class="label">${escapeHtml(s.label||'')}</div>
      `}
    </div>
  `).join('');

  sec.innerHTML = `
    <div class="block-head">
      <div class="num">٣</div>
      <h2>حتى الآن (مباشر)</h2>
      <p>أرقام المشروع منذ الانطلاقة وحتى اليوم</p>
    </div>
    <div class="live-banner">
      <span class="pulse-wrap"><span class="pulse-dot"></span> البث المباشر لأرقام المشروع</span>
    </div>
    <div class="mega-stats" id="stats-grid">${cards}</div>
    ${isAdmin ? `<div class="add-block add-stat-block" id="add-stat">+ إضافة رقم جديد</div>` : ''}
    ${isAdmin
      ? `<input class="field" id="since-input" style="max-width:460px;margin:20px auto 0;display:block;text-align:center;" value="${escapeHtml(state.sinceLabel||'')}" placeholder="نص توضيحي (مثال: الأرقام منذ يناير ٢٠٢٦)">`
      : (state.sinceLabel ? `<div class="since-line">${escapeHtml(state.sinceLabel)}</div>` : '')}
  `;
  return sec;
}

/* ------------- map ------------- */
function initMap(){
  const el = document.getElementById('map');
  if(!el || typeof L === 'undefined'){
    if(el) el.innerHTML = '<div class="loading">تعذّر تحميل الخريطة — تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة</div>';
    return;
  }

  if(mapObj){ mapObj.remove(); mapObj = null; }
  mapObj = L.map('map', { scrollWheelZoom:false }).setView(SUHAR_CENTER, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom:18
  }).addTo(mapObj);

  mapMarkers = [];
  (state.locations||[]).forEach(loc=>{
    const marker = L.marker([loc.lat, loc.lng]).addTo(mapObj);
    marker.bindPopup(`<b>${escapeHtml(loc.name)}</b>${loc.note ? '<br>'+escapeHtml(loc.note) : ''}`);
    mapMarkers.push(marker);
  });

  if(isAdmin){
    mapObj.on('click', e=>{
      if(!addLocationMode) return;
      openLocModal(e.latlng);
    });
  }

  renderLocList();
}

function openLocModal(latlng){
  pendingLatLng = latlng;
  document.getElementById('loc-name-input').value = '';
  document.getElementById('loc-note-input').value = '';
  document.getElementById('loc-modal').classList.add('show');
  document.getElementById('loc-name-input').focus();
}

function renderLocList(){
  const list = document.getElementById('loc-list');
  if(!list) return;
  list.innerHTML = (state.locations||[]).map(loc=>`
    <div class="loc-chip">
      <b>📍 ${escapeHtml(loc.name)}</b>
      ${isAdmin ? `<span class="rm" data-id="${loc.id}">✕</span>` : ''}
    </div>
  `).join('');
  if(isAdmin){
    list.querySelectorAll('.rm').forEach(el=>{
      el.addEventListener('click', e=>{
        const id = e.target.dataset.id;
        state.locations = state.locations.filter(l=>l.id!==id);
        render();
      });
    });
  }
}

/* ------------- live counters ------------- */
function setupStatsObserver(){
  if(isAdmin) return;
  const grid = document.getElementById('stats-grid');
  if(!grid) return;
  statsAnimated = false;
  const io = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && !statsAnimated){
        statsAnimated = true;
        animateStats();
        io.disconnect();
      }
    });
  }, { threshold:0.3 });
  io.observe(grid);
}

function animateStats(){
  document.querySelectorAll('.mega-stat .value').forEach(el=>{
    const raw = el.dataset.target || '0';
    const numMatch = raw.replace(/[^0-9]/g,'');
    const target = parseInt(numMatch || '0', 10);
    const suffix = raw.replace(/[0-9,]/g,'');
    const duration = 1600;
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      const current = Math.round(target * eased);
      el.textContent = current.toLocaleString('en-US') + suffix;
      if(p < 1) requestAnimationFrame(step);
      else el.textContent = raw;
    }
    requestAnimationFrame(step);
  });
}

/* ------------- scroll reveal ------------- */
function setupRevealObserver(){
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('in'); io.unobserve(entry.target); }
    });
  }, { threshold:0.12 });
  els.forEach(el=> io.observe(el));
}

/* ------------- handlers ------------- */
function attachGlobalHandlers(){
  document.getElementById('admin-toggle').onclick = ()=>{
    if(isAdmin){ isAdmin = false; addLocationMode = false; render(); }
    else{
      document.getElementById('pin-modal').classList.add('show');
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
    }
  };
  document.getElementById('save-btn').onclick = saveState;

  if(isAdmin){
    const toggleAddBtn = document.getElementById('toggle-add-mode');
    if(toggleAddBtn) toggleAddBtn.addEventListener('click', ()=>{
      addLocationMode = !addLocationMode;
      document.getElementById('add-mode-badge').classList.toggle('show', addLocationMode);
      toggleAddBtn.textContent = addLocationMode ? '✕ إلغاء وضع الإضافة' : '+ إضافة موقع بالنقر على الخريطة';
    });

    const coordBtn = document.getElementById('coord-add-btn');
    if(coordBtn) coordBtn.addEventListener('click', ()=>{
      const raw = document.getElementById('coord-input').value.trim();
      const m = raw.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      if(!m){ showToast('الرجاء لصق إحداثيات بصيغة صحيحة: خط العرض, خط الطول'); return; }
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if(mapObj) mapObj.setView([lat,lng], 16);
      openLocModal({ lat, lng });
      document.getElementById('coord-input').value = '';
    });

    const searchBtn = document.getElementById('search-place-btn');
    const searchInput = document.getElementById('search-place-input');
    const doSearch = async ()=>{
      const q = searchInput.value.trim();
      if(!q) return;
      searchBtn.textContent = 'جارِ البحث…';
      try{
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
          encodeURIComponent(q + ', صحار, عمان');
        const res = await fetch(url, { headers: { 'Accept-Language':'ar' } });
        const data = await res.json();
        if(data && data.length){
          const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
          if(mapObj) mapObj.setView([lat,lng], 15);
          showToast('تم العثور على المكان — اضغط عليه بالخريطة لتثبيت الموقع أو استخدم وضع الإضافة');
        } else {
          showToast('لم يتم العثور على هذا المكان، جرّب اسمًا آخر');
        }
      }catch(e){
        showToast('تعذّر البحث الآن، تأكد من الاتصال بالإنترنت');
      }
      searchBtn.textContent = 'بحث';
    };
    if(searchBtn) searchBtn.addEventListener('click', doSearch);
    if(searchInput) searchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

    document.querySelectorAll('.stage-title-input,.stage-text-input, [data-f="icon"]').forEach(el=>{
      el.addEventListener('input', e=>{
        if(e.target.dataset.id && state.stages.find(x=>x.id===e.target.dataset.id)){
          const s = state.stages.find(x=>x.id===e.target.dataset.id);
          if(s) s[e.target.dataset.f] = e.target.value;
        }
      });
    });
    document.querySelectorAll('.stage-del').forEach(el=>{
      el.addEventListener('click', async e=>{
        const id = e.target.dataset.id;
        await safeDelete(K.stageImg(id), true);
        state.stages = state.stages.filter(s=>s.id!==id);
        render();
      });
    });
    document.querySelectorAll('.stage-img-btn').forEach(el=>{
      el.addEventListener('click', e=> document.querySelector(`.stage-file[data-id="${e.target.dataset.id}"]`).click());
    });
    document.querySelectorAll('.stage-file').forEach(el=>{
      el.addEventListener('change', async e=>{
        const id = e.target.dataset.id;
        const s = state.stages.find(x=>x.id===id);
        const f = e.target.files[0];
        if(f && s){ s.image = await resizeImageJPEG(f, 700, 0.75); render(); }
      });
    });
    document.querySelectorAll('.stage-img-rm').forEach(el=>{
      el.addEventListener('click', e=>{
        const s = state.stages.find(x=>x.id===e.target.dataset.id);
        if(s){ s.image=''; render(); }
      });
    });
    const addStageBtn = document.getElementById('add-stage');
    if(addStageBtn) addStageBtn.addEventListener('click', ()=>{
      state.stages.push({ id: uid(), icon:'🔧', title:'مرحلة جديدة', text:'', image:'' });
      render();
    });

    const quoteInput = document.getElementById('quote-input');
    if(quoteInput) quoteInput.addEventListener('input', e=>{ state.closingQuote = e.target.value; });

    document.querySelectorAll('#stats-grid input').forEach(el=>{
      el.addEventListener('input', e=>{
        const st = state.stats.find(x=>x.id===e.target.dataset.id);
        if(st) st[e.target.dataset.f] = e.target.value;
      });
    });
    document.querySelectorAll('.stat-del').forEach(el=>{
      el.addEventListener('click', e=>{
        state.stats = state.stats.filter(x=>x.id!==e.target.dataset.id);
        render();
      });
    });
    const addStatBtn = document.getElementById('add-stat');
    if(addStatBtn) addStatBtn.addEventListener('click', ()=>{
      state.stats.push({ id: uid(), icon:'⭐', value:'0', suffix:'', label:'وصف الرقم' });
      render();
    });
    const sinceInput = document.getElementById('since-input');
    if(sinceInput) sinceInput.addEventListener('input', e=>{ state.sinceLabel = e.target.value; });
  }
}

document.getElementById('pin-cancel').addEventListener('click', ()=> document.getElementById('pin-modal').classList.remove('show'));
document.getElementById('pin-ok').addEventListener('click', tryPin);
document.getElementById('pin-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryPin(); });
function tryPin(){
  const val = document.getElementById('pin-input').value;
  if(val === ADMIN_PIN){
    isAdmin = true;
    document.getElementById('pin-modal').classList.remove('show');
    render();
  } else { showToast('رمز غير صحيح'); }
}

document.getElementById('loc-cancel').addEventListener('click', ()=>{
  document.getElementById('loc-modal').classList.remove('show');
  pendingLatLng = null;
});
document.getElementById('loc-save').addEventListener('click', ()=>{
  const name = document.getElementById('loc-name-input').value.trim();
  if(!name || !pendingLatLng){ showToast('الرجاء إدخال اسم المنطقة'); return; }
  state.locations.push({
    id: uid(), lat: pendingLatLng.lat, lng: pendingLatLng.lng,
    name, note: document.getElementById('loc-note-input').value.trim()
  });
  document.getElementById('loc-modal').classList.remove('show');
  pendingLatLng = null;
  addLocationMode = false;
  render();
});

loadState();
</script>
